name: Discord Duty Sync
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      max_messages:
        description: "จำนวนข้อความสูงสุดที่จะดึงต่อ channel (เว้นว่างได้ ใช้ default 100, ไม่มีผลถ้า full_sync = true)"
        required: false
        default: "100"
      full_sync:
        description: "ดึงย้อนไปจนถึงข้อความแรกสุดของทุก channel (true/false) — ใช้ตอน backfill ครั้งแรกเท่านั้น"
        required: false
        default: "false"
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Discord Sync
        run: node discord-sync.js
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GAS_URL: ${{ secrets.GAS_URL }}
          GAS_SECRET: ${{ secrets.GAS_SECRET }}
          MAX_MESSAGES: ${{ github.event.inputs.max_messages || '100' }}
          FULL_SYNC: ${{ github.event.inputs.full_sync || 'false' }}
